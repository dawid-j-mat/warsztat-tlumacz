<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listener · Live Translator</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="tele-header">
    <div class="brand">
      <h1>Live Translator</h1>
    </div>
    <div class="controls">
      <div class="toggle-group" role="group" aria-label="Show original">
        <button id="plToggle" type="button">Show PL</button>
      </div>
      <span class="conn off" id="conn" title="Connection status">
        <span class="dot"></span><span id="connText">connecting…</span>
      </span>
    </div>
  </header>

  <main class="tele-main" id="tele">
    <div class="tele-idle" id="idle">
      Waiting for the talk to begin…<br>
      <span style="font-size:0.7em;opacity:0.8">The translation will appear here automatically.</span>
    </div>
  </main>

  <!--
    PODGLĄD BEZ SUPABASE:
    Dopisz do adresu  ?demo  (np. listener.html?demo), aby zobaczyć widok
    teleprompter na atrapie danych – przydatne do oceny czcionki i układu.
  -->
  <!-- Wersja PRZYPIĘTA do 2.108.2: obsługuje publishable key (sb_publishable_)
       w Realtime. Starsze linie (≤2.49) NIE wysyłają publishable key poprawnie
       do WebSocketu → CHANNEL_ERROR. Nie schodź poniżej ~2.50. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2"></script>
  <script src="js/config.js"></script>
  <script src="js/listener.js"></script>
</body>
</html>
