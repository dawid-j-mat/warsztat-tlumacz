<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Słuchacz · Tłumacz na żywo</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="tele-header">
    <div class="brand">
      <h1>Tłumacz na żywo</h1>
    </div>
    <div class="controls">
      <div class="toggle-group" role="group" aria-label="Pokaż oryginał">
        <button id="plToggle" type="button">Pokaż PL</button>
      </div>
      <span class="conn off" id="conn" title="Stan połączenia">
        <span class="dot"></span><span id="connText">łączę…</span>
      </span>
    </div>
  </header>

  <main class="tele-main" id="tele">
    <div class="tele-idle" id="idle">
      Czekam na rozpoczęcie wypowiedzi…<br>
      <span style="font-size:0.7em;opacity:0.8">Tłumaczenie pojawi się tutaj automatycznie.</span>
    </div>
  </main>

  <!--
    PODGLĄD BEZ SUPABASE:
    Dopisz do adresu  ?demo  (np. listener.html?demo), aby zobaczyć widok
    teleprompter na atrapie danych – przydatne do oceny czcionki i układu.
  -->
  <!-- Wersja PRZYPIĘTA na sztywno. NIE wracać do @2 / @latest: nowe linie
       (2.107+) mają regresję WebSocketu — Realtime pada "WebSocket is closed
       before the connection is established" / CHANNEL_ERROR (supabase-js #1442). -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.7"></script>
  <script src="js/config.js"></script>
  <script src="js/listener.js"></script>
</body>
</html>
